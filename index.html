<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Paryaj Pam - Mots Cachés Football</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-paryaj">

    <div class="paryaj-game-wrapper">
        <!-- En-tête officiel Paryaj Pam -->
        <header class="paryaj-header">
            <div class="brand-box">
                <span class="brand-icon">⚽</span>
                <div class="brand-titles">
                    <h1>PARYAJ PAM</h1>
                    <p>Mots cachés • Football</p>
                </div>
            </div>

            <div class="header-controls">
                <select id="langSelect" class="paryaj-select">
                    <option value="fr" selected>🇫🇷 FR</option>
                    <option value="en">🇺🇸 EN</option>
                </select>
                <button id="themeToggleBtn" class="paryaj-icon-btn" title="Changer le thème">🌙</button>
            </div>
        </header>

        <!-- Barre de statut et Niveaux (1 à 20) -->
        <div class="paryaj-status-bar">
            <span id="levelDisplay" class="pill-badge">Niveau 1 / 20</span>
            <span id="scoreDisplay" class="pill-badge score-pill">Mots trouvés : 0</span>
        </div>

        <!-- Zone principale du jeu -->
        <main class="game-main-card">
            <div class="level-info">
                <h2 id="levelThemeTitle">Thème : Le Terrain</h2>
                <!-- Consigne claire pour l'utilisateur -->
                <p id="gameInstruction" class="game-instruction">Consigne : Glisse ton doigt ou ta souris de manière fluide d'une lettre à l'autre en ligne droite pour relier et trouver les mots cachés.</p>
            </div>

            <!-- Grille de jeu interactive -->
            <div id="gridContainer" class="word-grid"></div>

            <!-- Liste des mots à chercher pour le niveau -->
            <div class="words-to-find-container">
                <h3 id="wordsToFindTitle">Mots à chercher :</h3>
                <div id="wordList" class="word-chips"></div>
            </div>
        </main>

        <!-- Modale de fin de niveau -->
        <div id="levelModal" class="modal-backdrop hidden">
            <div class="modal-box">
                <div class="modal-emoji">⚽</div>
                <h2 id="modalTitle">Match Gagné !</h2>
                <p id="modalDesc">Prêt pour le niveau suivant ?</p>
                <button id="nextLevelBtn" class="paryaj-btn-primary">Niveau Suivant</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
